---
defaultGroups:
  - users
  - wheel
  - video
  - audio
  - storage
  - optical
  - network
  - input
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "archbridge-${first}"
  forbidden_names: [ localhost ]
presets:
  fullName:
    editable: true
  loginName:
    editable: true
